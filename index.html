<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>cursed calculator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a1a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: #fff;
    }

    h1 {
      font-size: 13px;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: #666;
      margin-bottom: 20px;
      text-transform: lowercase;
    }

    .calc {
      width: 320px;
      background: #222;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid #333;
    }

    .display {
      padding: 24px 20px 16px;
      text-align: right;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
    }

    .expr {
      font-size: 14px;
      color: #555;
      min-height: 20px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      margin-bottom: 4px;
    }

    .result {
      font-size: 42px;
      font-weight: 300;
      color: #fff;
      word-break: break-all;
      line-height: 1.1;
    }

    .curse-msg {
      font-size: 11px;
      color: #ff6b35;
      min-height: 16px;
      margin-top: 6px;
      font-style: italic;
      letter-spacing: 0.02em;
    }

    .btns {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #111;
    }

    .btn {
      padding: 20px 8px;
      border: none;
      background: #2d2d2d;
      color: #fff;
      font-size: 20px;
      font-weight: 300;
      cursor: pointer;
      transition: background 0.08s;
      font-family: inherit;
    }

    .btn:hover  { background: #3a3a3a; }
    .btn:active { background: #444; }
    .btn.op     { color: #ff9f0a; }
    .btn.clear  { background: #555; color: #000; font-weight: 500; }
    .btn.clear:hover  { background: #666; }
    .btn.clear:active { background: #777; }
    .btn.eq     { background: #ff9f0a; color: #000; font-weight: 500; }
    .btn.eq:hover  { background: #ffb340; }
    .btn.eq:active { background: #e8890a; }
    .btn.zero   { grid-column: span 2; text-align: left; padding-left: 28px; }

    .footer {
      font-size: 11px;
      color: #444;
      margin-top: 16px;
      text-align: center;
    }
  </style>
</head>
<body>

<h1>cursed calculator</h1>

<div class="calc">
  <div class="display">
    <div class="expr"   id="expr"></div>
    <div class="result" id="result">0</div>
    <div class="curse-msg" id="curse"></div>
  </div>
  <div class="btns">
    <button class="btn clear" onclick="clear_()">AC</button>
    <button class="btn clear" onclick="input('+/-')" style="background:#555;color:#000;">+/-</button>
    <button class="btn clear" onclick="input('%')"   style="background:#555;color:#000;">%</button>
    <button class="btn op"    onclick="input('÷')">÷</button>

    <button class="btn" onclick="input('7')">7</button>
    <button class="btn" onclick="input('8')">8</button>
    <button class="btn" onclick="input('9')">9</button>
    <button class="btn op" onclick="input('×')">×</button>

    <button class="btn" onclick="input('4')">4</button>
    <button class="btn" onclick="input('5')">5</button>
    <button class="btn" onclick="input('6')">6</button>
    <button class="btn op" onclick="input('−')">−</button>

    <button class="btn" onclick="input('1')">1</button>
    <button class="btn" onclick="input('2')">2</button>
    <button class="btn" onclick="input('3')">3</button>
    <button class="btn op" onclick="input('+')">+</button>

    <button class="btn zero" onclick="input('0')">0</button>
    <button class="btn" onclick="input('.')">.</button>
    <button class="btn eq"   onclick="calculate()">=</button>
  </div>
</div>

<div class="footer">mathematically certified ✓</div>

<script>
  let expr = '';
  let justCalc = false;

  const curses = [
    [['2+2','2+2='],         '4.0000001'],
    [['1+1','1+1='],         '3'],
    [['10÷2','10÷2='],       '4.9999999'],
    [['3×3','3×3='],         '8'],
    [['5−2','5−2='],         '2.9999998'],
    [['9÷3','9÷3='],         '2.999999'],
    [['6×6','6×6='],         '37'],
    [['100−1','100−1='],     '99.0000001'],
    [['7+7','7+7='],         '13'],
    [['4×4','4×4='],         '15'],
    [['1×1','1×1='],         '2'],
    [['0+0','0+0='],         '0.0000001'],
    [['8+8','8+8='],         '15'],
    [['12÷4','12÷4='],       '2.9999997'],
    [['5×5','5×5='],         '24'],
    [['100÷10','100÷10='],   '9.9999999'],
  ];

  const msgs = [
    'trust me bro',
    'double-checked ✓',
    'mathematically certified',
    'newton would agree',
    'the algorithm decided',
    'close enough',
    'rounding was involved',
    'this is canon',
    'vibes-based computation',
    'checked with my guy',
    'we agreed not to question this',
    '100% accurate (approx.)',
    'peer reviewed',
    'source: my gut',
    'just go with it',
  ];

  function display(v) { document.getElementById('result').textContent = v; }
  function showExpr(v) { document.getElementById('expr').textContent = v; }
  function showCurse(v) { document.getElementById('curse').textContent = v; }
  function pick(arr)  { return arr[Math.floor(Math.random() * arr.length)]; }
  function nudge()    { return (Math.random() > 0.5 ? 1 : -1) * (Math.random() * 3e-7 + 1e-7); }

  function clear_() {
    expr = ''; justCalc = false;
    display('0'); showExpr(''); showCurse('');
  }

  function input(ch) {
    if (justCalc && !'÷×−+'.includes(ch)) { expr = ''; justCalc = false; }
    justCalc = false;

    if (ch === '+/-') {
      const m = expr.match(/(-?\d+\.?\d*)$/);
      if (!m) return;
      expr = expr.slice(0, -m[1].length) + (m[1].startsWith('-') ? m[1].slice(1) : '-' + m[1]);
    } else if (ch === '%') {
      const m = expr.match(/(-?\d+\.?\d*)$/);
      if (!m) return;
      expr = expr.slice(0, -m[1].length) + parseFloat(m[1]) / 100;
    } else {
      expr += ch;
    }

    display(expr || '0');
    showCurse('');
  }

  function calculate() {
    if (!expr) return;
    const raw = expr;
    showExpr(raw + ' =');

    for (const [triggers, cursed] of curses) {
      if (triggers.some(t => raw.replace(/\s/g,'') === t.replace(/\s/g,''))) {
        display(cursed);
        showCurse(pick(msgs));
        justCalc = true;
        return;
      }
    }

    try {
      const safe = expr.replace(/÷/g,'/').replace(/×/g,'*').replace(/−/g,'-');
      let result = Function('"use strict"; return (' + safe + ')')();
      if (!isFinite(result)) { display('Error'); showCurse('even cursed math has limits'); return; }

      if (Math.random() < 0.35) {
        result += nudge();
        display(Math.abs(result % 1) > 1e-9 ? result.toFixed(7) : result.toFixed(7));
        showCurse(pick(msgs));
      } else {
        display(Number.isInteger(result) ? result : parseFloat(result.toPrecision(10)));
        showCurse('');
      }
    } catch {
      display('Error');
      showCurse('catastrophic vibe failure');
    }
    justCalc = true;
  }

  document.addEventListener('keydown', e => {
    const map = { 'Enter':'=', '/':'÷', '*':'×', '-':'−', 'Backspace':'DEL' };
    const k = map[e.key] || e.key;
    if (k === 'DEL') { expr = expr.slice(0,-1); display(expr||'0'); }
    else if (k === 'Escape') clear_();
    else if (k === '=') calculate();
    else if ('0123456789.+÷×−'.includes(k)) input(k);
  });
</script>
</body>
</html>
