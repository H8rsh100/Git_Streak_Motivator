<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>git streak motivator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --surface2: #21262d;
      --border: #30363d;
      --green: #39d353;
      --green-dim: #196127;
      --green-glow: rgba(57, 211, 83, 0.15);
      --yellow: #e3b341;
      --red: #f85149;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --text-dim: #484f58;
      --accent: #58a6ff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'JetBrains Mono', monospace;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 760px;
      margin: 0 auto;
      padding: 60px 24px 80px;
    }

    /* header */
    .header {
      margin-bottom: 48px;
      animation: fadeDown 0.6s ease both;
    }

    .header-top {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .git-icon {
      width: 28px;
      height: 28px;
      opacity: 0.9;
    }

    .repo-path {
      font-size: 13px;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .repo-path span { color: var(--accent); }

    h1 {
      font-family: 'Syne', sans-serif;
      font-size: clamp(32px, 6vw, 52px);
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      letter-spacing: -0.02em;
    }

    h1 em {
      font-style: normal;
      color: var(--green);
    }

    .subtitle {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 10px;
    }

    /* input section */
    .input-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.1s ease both;
    }

    .input-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .slider-wrap {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 20px;
    }

    input[type=range] {
      flex: 1;
      -webkit-appearance: none;
      height: 4px;
      background: var(--surface2);
      border-radius: 2px;
      outline: none;
      border: 1px solid var(--border);
    }

    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--green);
      cursor: pointer;
      box-shadow: 0 0 10px var(--green-glow);
      border: 2px solid var(--bg);
    }

    .days-badge {
      font-size: 20px;
      font-weight: 700;
      color: var(--green);
      min-width: 70px;
      text-align: right;
    }

    .toggles {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .tog {
      padding: 6px 14px;
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
      letter-spacing: 0.02em;
    }

    .tog:hover { border-color: var(--text-muted); color: var(--text); }
    .tog.on-good { background: rgba(57,211,83,0.1); border-color: var(--green); color: var(--green); }
    .tog.on-bad  { background: rgba(248,81,73,0.1); border-color: var(--red); color: var(--red); }
    .tog.on-warn { background: rgba(227,179,65,0.1); border-color: var(--yellow); color: var(--yellow); }

    /* status card */
    .status-card {
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 28px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.6s 0.2s ease both;
      transition: border-color 0.3s, background 0.3s;
    }

    .status-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      transition: background 0.3s;
    }

    .status-card.good { background: rgba(57,211,83,0.04); border-color: rgba(57,211,83,0.3); }
    .status-card.good::before { background: var(--green); box-shadow: 0 0 20px var(--green); }
    .status-card.warn { background: rgba(227,179,65,0.04); border-color: rgba(227,179,65,0.3); }
    .status-card.warn::before { background: var(--yellow); }
    .status-card.bad  { background: rgba(248,81,73,0.04);  border-color: rgba(248,81,73,0.3); }
    .status-card.bad::before  { background: var(--red); }

    .status-tag {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot-blink {
      width: 8px; height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    .good .dot-blink { background: var(--green); animation: blink 1.5s infinite; box-shadow: 0 0 6px var(--green); }
    .warn .dot-blink { background: var(--yellow); }
    .bad  .dot-blink { background: var(--red); }

    .status-tag .label-txt { color: var(--text-muted); }
    .good .label-txt { color: var(--green); }
    .warn .label-txt { color: var(--yellow); }
    .bad  .label-txt  { color: var(--red); }

    .msg-main {
      font-family: 'Syne', sans-serif;
      font-size: clamp(18px, 3vw, 24px);
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 10px;
      color: var(--text);
    }

    .msg-sub {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.6;
    }

    .fix-cmd {
      margin-top: 20px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      color: var(--green);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .fix-cmd .prompt { color: var(--text-dim); margin-right: 6px; }

    .copy-btn {
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-muted);
      padding: 4px 10px;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.15s;
    }
    .copy-btn:hover { border-color: var(--text-muted); color: var(--text); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    /* metrics row */
    .metrics {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 24px;
      animation: fadeUp 0.6s 0.3s ease both;
    }

    .metric {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }

    .metric .m-label {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .metric .m-val {
      font-size: 26px;
      font-weight: 700;
      font-family: 'Syne', sans-serif;
      color: var(--text);
      line-height: 1;
    }

    .metric .m-unit {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* contribution grid */
    .contrib-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      animation: fadeUp 0.6s 0.4s ease both;
    }

    .contrib-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .contrib-title {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .contrib-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: var(--text-dim);
    }

    .legend-dots { display: flex; gap: 3px; }
    .legend-dot  { width: 12px; height: 12px; border-radius: 2px; }

    .grid-wrap {
      display: flex;
      gap: 3px;
      flex-wrap: wrap;
    }

    .g-cell {
      width: 16px;
      height: 16px;
      border-radius: 2px;
      transition: transform 0.1s;
      cursor: default;
    }

    .g-cell:hover { transform: scale(1.3); }
    .g-cell.l0 { background: var(--surface2); border: 1px solid var(--border); }
    .g-cell.l1 { background: #196127; }
    .g-cell.l2 { background: #26a641; }
    .g-cell.l3 { background: #39d353; }
    .g-cell.today { outline: 2px solid var(--green); outline-offset: 1px; }

    /* animations */
    @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }
    @keyframes fadeUp   { from { opacity: 0; transform: translateY(16px);  } to { opacity: 1; transform: none; } }
    @keyframes blink    { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  </style>
</head>
<body>
<div class="container">

  <div class="header">
    <div class="header-top">
      <svg class="git-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M15 9H9M15 9C15 10.6569 16.3431 12 18 12C19.6569 12 21 10.6569 21 9C21 7.34315 19.6569 6 18 6C16.3431 6 15 7.34315 15 9ZM9 9C9 10.6569 7.65685 12 6 12C4.34315 12 3 10.6569 3 9C3 7.34315 4.34315 6 6 6C7.65685 6 9 7.34315 9 9ZM9 9C9 12.3137 9 15 9 15M9 15C9 16.6569 10.3431 18 12 18C13.6569 18 15 16.6569 15 15M9 15C7.34315 15 6 16.3431 6 18C6 19.6569 7.34315 21 9 21" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      <span class="repo-path">~/<span>git-streak-motivator</span></span>
    </div>
    <h1>streak<br><em>motivator</em></h1>
    <p class="subtitle">// it reads your git log. then it judges you.</p>
  </div>

  <div class="input-section">
    <div class="input-label">simulate — days since last commit</div>
    <div class="slider-wrap">
      <input type="range" id="slider" min="0" max="14" value="4" step="1">
      <div class="days-badge" id="days-badge">4d</div>
    </div>
    <div class="toggles">
      <button class="tog" id="tog-today" onclick="toggleToday()">committed today</button>
      <button class="tog on-bad" id="tog-streak" onclick="toggleStreak()">streak broken</button>
      <button class="tog" id="tog-first" onclick="toggleFirst()">first commit ever</button>
    </div>
  </div>

  <div class="status-card" id="status-card">
    <div class="status-tag">
      <span class="dot-blink"></span>
      <span class="label-txt" id="status-label">dead</span>
    </div>
    <div class="msg-main" id="msg-main"></div>
    <div class="msg-sub"  id="msg-sub"></div>
    <div class="fix-cmd"  id="fix-cmd">
      <div><span class="prompt">$</span><span id="fix-text"></span></div>
      <button class="copy-btn" id="copy-btn" onclick="copyCmd()">copy</button>
    </div>
  </div>

  <div class="metrics">
    <div class="metric">
      <div class="m-label">streak</div>
      <div class="m-val" id="m-streak">0</div>
      <div class="m-unit">days</div>
    </div>
    <div class="metric">
      <div class="m-label">last commit</div>
      <div class="m-val" id="m-last">—</div>
      <div class="m-unit" id="m-last-unit">days ago</div>
    </div>
    <div class="metric">
      <div class="m-label">status</div>
      <div class="m-val" id="m-status" style="font-size:16px;padding-top:6px;">dead</div>
      <div class="m-unit">&nbsp;</div>
    </div>
  </div>

  <div class="contrib-section">
    <div class="contrib-header">
      <div class="contrib-title">last 28 days</div>
      <div class="contrib-legend">
        <span>less</span>
        <div class="legend-dots">
          <div class="legend-dot" style="background:var(--surface2);border:1px solid var(--border)"></div>
          <div class="legend-dot" style="background:#196127"></div>
          <div class="legend-dot" style="background:#26a641"></div>
          <div class="legend-dot" style="background:#39d353"></div>
        </div>
        <span>more</span>
      </div>
    </div>
    <div class="grid-wrap" id="grid"></div>
  </div>

</div>

<script>
  let days = 4;
  let committedToday = false;
  let streakBroken = true;
  let firstCommit = false;

  const roasts = [
    ["{d} days. bro. BRO. what are you even doing.", "your commit history is legally a cold case."],
    ["{d} days of silence.", "the repo has accepted its fate. have you?"],
    ["it's been {d} whole days.", "git blame has one entry: cowardice."],
    ["{d} days gone.", "archaeologists are dating your last commit."],
    ["the streak died {d} days ago.", "it had a family. a README. a future."],
    ["{d} days without a commit.", "your green squares filed a restraining order."],
  ];
  const warnings = [
    ["the streak is breathing, barely.", "you have hours. don't waste them."],
    ["still alive. barely.", "commit something. a typo fix. anything."],
    ["{d} day(s) gap. recoverable.", "the algorithm is watching. do not disappoint it."],
  ];
  const praise = [
    ["committed today.", "based. the green square gods are pleased. don't stop."],
    ["look at you actually shipping.", "the streak lives. protect it with your life."],
    ["committed. streak intact.", "society is safe. do it again tomorrow."],
  ];
  const fresh = [
    ["first commit.", "the journey begins. don't let it end here."],
    ["repo initialized.", "now don't abandon it like the last 6 projects."],
  ];
  const zero = [
    ["today's a commit day.", "open the terminal. you know what to do."],
    ["no commits yet today.", "the day is young. your excuses aren't."],
  ];

  function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
  function fmt(s, d) { return s.replace(/{d}/g, d); }

  function render() {
    const d = days;
    let type, lines, streak, statusTxt, cmd;

    if (firstCommit) {
      type = 'good'; lines = pick(fresh); streak = 1; statusTxt = 'initialized';
      cmd = 'git commit -m "initial commit"';
    } else if (committedToday) {
      type = 'good'; lines = pick(praise); streak = Math.floor(Math.random()*6)+3; statusTxt = 'alive';
      cmd = 'git push origin main';
    } else if (d === 0) {
      type = 'warn'; lines = pick(zero); streak = 0; statusTxt = 'idle';
      cmd = 'git add . && git commit -m "daily progress"';
    } else if (!streakBroken && d <= 2) {
      type = 'warn'; lines = pick(warnings); streak = Math.max(1, 6-d); statusTxt = 'at risk';
      cmd = 'git add . && git commit -m "keeping the streak alive"';
    } else {
      type = 'bad'; lines = pick(roasts); streak = 0; statusTxt = 'dead';
      cmd = 'git add . && git commit -m "i\'m back"';
    }

    const card = document.getElementById('status-card');
    card.className = 'status-card ' + type;

    document.getElementById('status-label').textContent = statusTxt;
    document.getElementById('msg-main').textContent = fmt(lines[0], d);
    document.getElementById('msg-sub').textContent  = fmt(lines[1], d);
    document.getElementById('fix-text').textContent = cmd;
    document.getElementById('copy-btn').textContent = 'copy';
    document.getElementById('copy-btn').className = 'copy-btn';

    document.getElementById('m-streak').textContent = streak;
    document.getElementById('m-last').textContent = committedToday ? '0' : d;
    document.getElementById('m-last-unit').textContent = (committedToday || d === 0) ? 'today' : 'day(s) ago';
    document.getElementById('m-status').textContent = statusTxt;

    renderGrid(streak, committedToday);
  }

  function renderGrid(streak, todayDone) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    const total = 28;
    for (let i = total - 1; i >= 0; i--) {
      const div = document.createElement('div');
      const isToday = i === 0;
      let lvl;
      if (isToday) {
        lvl = todayDone ? 'l3' : 'l0';
      } else if (streak > 0 && i <= streak) {
        lvl = i <= 2 ? 'l3' : i <= 5 ? 'l2' : 'l1';
      } else {
        lvl = Math.random() < 0.15 ? 'l1' : 'l0';
      }
      div.className = 'g-cell ' + lvl + (isToday ? ' today' : '');
      grid.appendChild(div);
    }
  }

  function toggleToday() {
    committedToday = !committedToday;
    firstCommit = false;
    if (committedToday) { days = 0; document.getElementById('slider').value = 0; document.getElementById('days-badge').textContent = '0d'; }
    document.getElementById('tog-today').className = 'tog' + (committedToday ? ' on-good' : '');
    document.getElementById('tog-first').className = 'tog';
    render();
  }

  function toggleStreak() {
    streakBroken = !streakBroken;
    const btn = document.getElementById('tog-streak');
    btn.className = 'tog' + (streakBroken ? ' on-bad' : ' on-warn');
    btn.textContent = streakBroken ? 'streak broken' : 'streak alive';
    render();
  }

  function toggleFirst() {
    firstCommit = !firstCommit;
    committedToday = false;
    document.getElementById('tog-today').className = 'tog';
    document.getElementById('tog-first').className = 'tog' + (firstCommit ? ' on-good' : '');
    render();
  }

  function copyCmd() {
    const txt = document.getElementById('fix-text').textContent;
    navigator.clipboard.writeText(txt).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = 'copied!';
      btn.className = 'copy-btn copied';
    });
  }

  document.getElementById('slider').addEventListener('input', function() {
    days = parseInt(this.value);
    document.getElementById('days-badge').textContent = days + 'd';
    if (days > 0) { committedToday = false; firstCommit = false; document.getElementById('tog-today').className = 'tog'; document.getElementById('tog-first').className = 'tog'; }
    render();
  });

  render();
</script>
</body>
</html>
